<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>RIDE™</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app" data-mode="eco">
<svg id="dash" viewBox="0 0 980 545" role="img" aria-label="Compteur de vitesse RIDE">
  <defs>
    <radialGradient id="aura" cx="488" cy="405" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--c);stop-opacity:.2"/><stop offset="1" style="stop-color:var(--c);stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="375" x2="0" y2="545" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#1c1c1c"/>
    </linearGradient>
    <linearGradient id="arcg" x1="0" y1="50" x2="0" y2="545" gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:var(--cl)"/><stop offset=".55" style="stop-color:var(--c)"/><stop offset="1" style="stop-color:var(--cd)"/>
    </linearGradient>
    <linearGradient id="ng" x1="137" y1="0" x2="310" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" style="stop-color:var(--c);stop-opacity:.9"/><stop offset="1" style="stop-color:var(--c);stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="fadeG" x1="0" y1="545" x2="0" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="fadeOut" maskUnits="userSpaceOnUse" x="0" y="0" width="980" height="700">
      <rect width="980" height="545" fill="#fff"/><rect y="545" width="980" height="155" fill="url(#fadeG)"/>
    </mask>
  </defs>
  <g id="content">

  <!-- fond, route, perspective -->
  <rect width="980" height="545" fill="url(#aura)"/>
  <rect y="375" width="980" height="325" fill="url(#road)"/>
  <path d="M388 375 L92 700 M588 375 L884 700" stroke="#4a4a4a" stroke-width="1.5" fill="none"/>

  <!-- cadran -->
  <circle cx="488" cy="405" r="355" fill="none" stroke="url(#arcg)" stroke-width="4"/>
  <g id="ticks"></g>
  <g id="labels"></g>
  <polygon id="needle" points="137,400 310,403 310,407 137,410" fill="url(#ng)"/>
  <text x="743" y="488" text-anchor="middle" class="unit sm">x10</text>

  <!-- lueur + horizon + vélo -->
  <ellipse cx="488" cy="340" rx="125" ry="28" fill="url(#glow)" opacity=".85"/>
  <ellipse cx="488" cy="395" rx="95" ry="16" fill="url(#glow)" opacity=".35"/>
  <line x1="378" y1="365" x2="598" y2="365" class="horizon" stroke-width="2"/>
  <image id="bike" href="bike.png" x="455" y="354" width="66" height="201" preserveAspectRatio="xMidYMin meet"/>

  <!-- textes -->
  <text id="msg" x="488" y="28" text-anchor="middle" class="unit sm"></text>
  <text id="avg" x="62" y="66" text-anchor="middle" class="big glow">0.0</text>
  <text x="62" y="96" text-anchor="middle" class="unit">km/h</text>
  <text x="488" y="196" text-anchor="middle" class="unit lg">km/h</text>
  <text id="spd" x="488" y="292" text-anchor="middle" class="spd glow">0</text>
  <text id="w" x="910" y="485" text-anchor="middle" class="big glow">≈0</text>
  <text x="910" y="518" text-anchor="middle" class="unit">W/h</text>

  <!-- limitation de vitesse -->
  <g id="limit" style="display:none">
    <circle cx="341" cy="386" r="33" fill="#fff" stroke="#e8112d" stroke-width="8"/>
    <text id="limtxt" x="341" y="386" dy=".36em" text-anchor="middle" style="fill:#000;font-size:28px;font-weight:800">30</text>
  </g>

  <!-- prochaine direction -->
  <g id="turn" style="display:none">
    <g id="turnpos" transform="translate(867,25)" fill="#fff">
      <path class="t-turn" d="M10 80 V35 Q10 15 30 15 H50 V0 L80 22 L50 44 V30 H35 Q28 30 28 38 V80 Z"/>
      <path class="t-straight" d="M40 0 L72 34 H52 V80 H28 V34 H8 Z" style="display:none"/>
    </g>
  </g>

  <!-- boussole -->
  <g transform="translate(907,205)">
    <circle r="40" fill="none" stroke="#fff" stroke-width="3"/>
    <g id="cn">
      <polygon points="0,-27 -9,2 9,2" fill="#fff"/>
      <polygon points="0,27 -9,2 9,2" fill="#6a6a6a"/>
    </g>
  </g>

  <!-- indicateurs de mode -->
  <g class="ic i-ped" transform="translate(62,500)" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="4" cy="-34" r="6" fill="#fff" stroke="none"/>
    <path d="M3 -24 L-1 -4 M-1 -4 L8 6 L10 18 M-1 -4 L-8 8 L-14 16 M3 -22 L-8 -12 M3 -22 L13 -10"/>
    <g fill="#fff" stroke="none">
      <polygon points="-40,36 -32,24 -20,24 -28,36"/><polygon points="-20,36 -12,24 0,24 -8,36"/>
      <polygon points="0,36 8,24 20,24 12,36"/><polygon points="20,36 28,24 40,24 32,36"/>
    </g>
  </g>
  <g class="ic i-bike" transform="translate(62,500)" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-26" cy="10" r="17"/><circle cx="26" cy="10" r="17"/>
    <path d="M-26 10 L-12 -14 L16 -14 L26 10 M-12 -14 L-6 10 L16 -14 M-26 10 L-6 10 M16 -14 L14 -22 H22 M-18 -17 H-6"/>
  </g>
  <g class="ic i-car" transform="translate(62,505)">
    <path d="M-38 16 V2 Q-38 -2 -34 -3 L-26 -17 H26 L34 -3 Q38 -2 38 2 V16 Z" fill="#fff"/>
    <path d="M-24 -3 L-18 -12 H18 L24 -3 Z" fill="#000"/>
    <circle cx="-22" cy="17" r="8" fill="#000" stroke="#fff" stroke-width="3"/><circle cx="22" cy="17" r="8" fill="#000" stroke="#fff" stroke-width="3"/>
  </g>
  </g>
</svg>
<div id="mapwrap">
  <div id="map"></div>
  <button id="recenter" type="button" hidden aria-label="Recentrer sur ma position">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/></svg>
  </button>
</div>
</main>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script defer src="app.js"></script>
</body>
</html>
